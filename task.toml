tags = ["lean4", "mathlib", "drazin-inverse", "ring-theory"]
expert_time_estimate_hours = 4
relevant_experience = "Research mathematician specializing in operator theory and Drazin invertibility, with hands-on experience formalizing algebraic structures in Lean 4 and Mathlib."
difficulty_explanation = "The task requires defining a custom Drazin invertibility structure with index k=1 in Lean 4 and proving that a ring decomposes as a direct sum of the range and kernel of a Drazin invertible element. This demands precise manipulation of non-commutative ring axioms in Mathlib, careful construction of set-theoretic membership proofs, and managing Lean 4's type system for algebraic structures. The proof involves multiple dependent steps: establishing key algebraic identities such as a(ab) = a via commutativity and the aba axiom, constructing decomposition witnesses, and proving both the spanning property and the trivial intersection. Agents typically struggle with the non-commutative rewriting chains and the interplay between multiplicative and additive reasoning."
solution_explanation = "The reference solution defines an IsDrazinInvertible structure encoding the three Drazin conditions (bab=b, ab=ba, aba=a), introduces set-theoretic range and kernel definitions, then proves the decomposition theorem in two parts. Part 1 decomposes any x as abx + (x - abx) with explicit witnesses and derives a(ab) = a from commutativity and the aba condition. Part 2 shows the intersection is trivial via the chain a*t = (aba)*t = (ab)(at) = (ba)(at) = 0."
verification_explanation = "Verification compiles the submitted Lean 4 file with lake build targeting the module Tex2lean.Model.Theorem, then builds a separate checker module that type-checks the theorem's signature against the required statement. Lean's kernel is the ground truth: a file that compiles has every proof term verified for logical correctness. The verifier also rejects files containing sorry placeholders."

[verifier]
