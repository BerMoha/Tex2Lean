[task]
name = "afterquery/drazin-theorem"
description = "Formalize the Drazin invertibility characterization theorem (both directions) in Lean 4 with Mathlib: a is Drazin invertible iff A = a^n A ⊕ N(a^n), with spectral idempotent decomposition."
authors = [{ name = "Mohamed Berkani", email = "berkanimoha@gmail.com" }]
keywords = ["lean4", "mathlib", "drazin-inverse", "ring-theory", "direct-sum"]

[metadata]
author_name = "Mohamed Berkani"
author_email = "berkanimoha@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://github.com/BerMoha"
conflicts_of_interest = "None"
domain = "mathematical-sciences"
field = "formal-mathematics"
subfield = "operator-theory"
category = "Science"
subcategory = "Formal Mathematics & Theorem Proving"
tags = ["lean4", "mathlib", "drazin-inverse", "ring-theory"]
expert_time_estimate_hours = 4
relevant_experience = "Research mathematician specializing in operator theory and Drazin invertibility, with hands-on experience formalizing algebraic structures in Lean 4 and Mathlib."
difficulty_explanation = "The task requires formalizing a full biconditional characterization of Drazin invertibility in a non-commutative ring, along with a spectral idempotent decomposition. The forward direction (Drazin invertible ⇒ direct sum) requires reducing from general index k to k=1 via power manipulation, then constructing decomposition witnesses. The converse (direct sum ⇒ Drazin invertible) is substantially harder: it requires building idempotents from the decomposition of 1, proving they are complementary, showing cA = c²A, constructing the group inverse from a factorization p = cb, and verifying all three Drazin conditions. The proof spans ~800 lines across multiple files and demands mastery of non-commutative ring reasoning, Submodule lattice operations, and Mathlib's opposite-module machinery for right ideals."
solution_explanation = "The reference solution is a modular development of 14 Lean files. Model/Prelude defines the vocabulary (rightMul, rightAnn, DirectSumDecomp, IsDrazinInvertible). Analysis/GroupInverse proves the core equivalence: DirectSumDecomp c ↔ c has a group inverse. Analysis/DrazinPower handles the reduction from Drazin index k to group invertibility of a^(k+1). Analysis/SpectralIdempotents extracts idempotents p=cd, q=1-cd from a group inverse. Analysis/TheoremProof assembles the capstone. The proof uses noncomm_ring and abel tactics for algebraic simplification, and the Submodule lattice API for ideal comparisons."
verification_explanation = "Verification runs lake build on the full project to compile all modules, then builds a separate Checker module that type-checks the capstone theorem drazin_characterization against the required biconditional statement. Lean's kernel verifies logical correctness. The verifier also rejects files containing sorry placeholders."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

